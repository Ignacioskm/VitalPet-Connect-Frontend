<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Iniciar Sesión - VitalPet Connect</title>
</head>
<body>

    <main class="login-container">
        <div class="card login-card">
            
            <!-- Cabecera estilo Sidebar -->
            <div class="brand-header">
                <div class="brand-badge">
                    <i class="fa-solid fa-paw"></i>
                </div>
                <h4 class="brand-title">VitalPet Connect</h4>
                <p class="brand-subtitle mb-0">Sistema de Gestión Veterinaria</p>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="form-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                        <div class="input-group custom-input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.cl" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold text-secondary">Contraseña</label>
                        <div class="input-group custom-input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-vitalpet w-100 mb-3">
                        Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                    
                    <div class="text-center">
                        <span class="small text-muted">¿No tienes cuenta?</span> 
                        <a href="register.html" class="register-link small ms-1">Regístrate aquí</a>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login-register.js"></script>
    <script src="js/mock-data.js"></script>

    <!-- Modal de alerta con bootstrap -->
    <div class="modal fade" id="customAlertModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
                
                <!-- Cabecera -->
                <div class="modal-header border-0 text-white justify-content-center flex-column pt-4 pb-2" style="background-color: #00275e;">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2 shadow" id="modalBadge" style="width: 60px; height: 60px; background-color: #0A58CA;">
                        <i class="fa-solid fa-circle-check fs-2 text-white" id="modalIcon"></i>
                    </div>
                    <h5 class="modal-title fw-bold fs-4" id="modalTitle">Notificación</h5>
                </div>

                <!-- Cuerpo -->
                <div class="modal-body text-center px-4 py-3">
                    <p class="mb-0 text-secondary fs-6" id="modalMessage">Mensaje del sistema...</p>
                </div>

                <!-- Pie -->
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn text-white fw-semibold px-4 rounded-3 shadow-sm" id="modalConfirmBtn" data-bs-dismiss="modal" style="background-color: #0A58CA;">
                        Entendido
                    </button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
