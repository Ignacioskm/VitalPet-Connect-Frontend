<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta | VitalPet Connect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

  <!-- menu lateral: el cliente solo ve su cuenta, no el panel de administracion -->
  <aside class="vp-sidebar">
    <a href="dashboard-user.html" class="vp-logo">
      <i class="bi bi-heart-pulse-fill fs-4"></i>
      VitalPet Connect
    </a>

    <nav>
      <a href="dashboard-user.html" class="vp-link activo">
        <i class="bi bi-person-circle me-2"></i>Mi cuenta
      </a>

      <hr>

      <a href="../index.html" class="vp-link">
        <i class="bi bi-shop me-2"></i>Ir al sitio
      </a>
      <a href="../login.html" class="vp-link">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesion
      </a>
    </nav>
  </aside>

  <main class="vp-contenido">

    <header class="d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <h2 class="vp-titulo">Hola, <span id="nombreCliente"></span></h2>
        <p class="vp-subtitulo">Tus mascotas y tus citas en la clinica</p>
      </div>

      <!-- mientras el login no guarde la sesion, simulo al cliente con este select -->
      <div class="d-flex align-items-center gap-2">
        <label for="selectCliente" class="vp-ayuda mb-0">Ver como:</label>
        <select id="selectCliente" class="form-select form-select-sm"></select>
      </div>
    </header>

    <!-- mis mascotas -->
    <section class="vp-caja">
      <h5><i class="bi bi-heart-pulse me-2"></i>Mis mascotas</h5>

      <div class="table-responsive">
        <table class="table vp-tabla align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Especie</th>
              <th>Raza</th>
              <th>Edad</th>
            </tr>
          </thead>
          <tbody id="tablaMisMascotas"></tbody>
        </table>
      </div>
    </section>

    <!-- mis citas -->
    <section class="vp-caja">
      <h5><i class="bi bi-calendar-check me-2"></i>Mis citas</h5>

      <div class="table-responsive">
        <table class="table vp-tabla align-middle">
          <thead>
            <tr>
              <th>Mascota</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Motivo</th>
              <th>Veterinario</th>
            </tr>
          </thead>
          <tbody id="tablaMisCitas"></tbody>
        </table>
      </div>

      <p class="vp-ayuda mb-0">
        Para agendar una nueva cita usa el boton Agendar Cita del sitio.
      </p>
    </section>

  </main>

  <!-- primero los datos, despues la logica -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
