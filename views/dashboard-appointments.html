<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas | Panel VitalPet Connect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

  <!-- menu lateral -->
  <aside class="vp-sidebar">
    <a href="dashboard-home.html" class="vp-logo">
      <i class="bi bi-heart-pulse-fill fs-4"></i>
      VitalPet Connect
    </a>

    <nav>
      <a href="dashboard-home.html" class="vp-link">
        <i class="bi bi-speedometer2 me-2"></i>Inicio
      </a>
      <a href="dashboard-pets.html" class="vp-link">
        <i class="bi bi-heart-pulse me-2"></i>Mascotas
      </a>
      <a href="dashboard-appointments.html" class="vp-link activo">
        <i class="bi bi-calendar-check me-2"></i>Citas
      </a>
      <a href="dashboard-settings.html" class="vp-link">
        <i class="bi bi-gear me-2"></i>Configuracion
      </a>

      <hr>

      <a href="../index.html" class="vp-link">
        <i class="bi bi-shop me-2"></i>Ir al sitio
      </a>
      <a href="../login.html" class="vp-link">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesion
      </a>
    </nav>
  </aside>

  <main class="vp-contenido">

    <header>
      <h2 class="vp-titulo">Gestion de citas</h2>
      <p class="vp-subtitulo">Agenda de atenciones de la clinica</p>
    </header>

    <div id="mensajeOk" class="alert alert-success d-none"></div>

    <!-- formulario -->
    <section class="vp-caja">
      <h5><i class="bi bi-calendar-plus me-2"></i>Agendar una cita</h5>

      <form id="formCita" novalidate>
        <div class="row g-3">

          <div class="col-12 col-md-4">
            <label for="cMascota" class="form-label">Mascota <span class="text-danger">*</span></label>
            <select id="cMascota" class="form-select">
              <option value="">Selecciona una mascota</option>
            </select>
            <span class="vp-error" id="errMascotaCita"></span>
          </div>

          <div class="col-12 col-md-3">
            <label for="cFecha" class="form-label">Fecha <span class="text-danger">*</span></label>
            <input type="date" id="cFecha" class="form-control">
            <span class="vp-error" id="errFecha"></span>
          </div>

          <div class="col-12 col-md-2">
            <label for="cHora" class="form-label">Hora <span class="text-danger">*</span></label>
            <input type="time" id="cHora" class="form-control">
            <span class="vp-ayuda">09:00 a 19:00</span>
            <span class="vp-error" id="errHora"></span>
          </div>

          <div class="col-12 col-md-3">
            <label for="cVeterinario" class="form-label">Veterinario <span class="text-danger">*</span></label>
            <select id="cVeterinario" class="form-select">
              <option value="">Selecciona un veterinario</option>
            </select>
            <span class="vp-error" id="errVeterinario"></span>
          </div>

          <div class="col-12">
            <label for="cMotivo" class="form-label">Motivo de la consulta <span class="text-danger">*</span></label>
            <textarea id="cMotivo" class="form-control" rows="2" maxlength="500"
                      placeholder="Describe brevemente el motivo de la atencion"></textarea>
            <span class="vp-ayuda" id="contadorMotivo">0 / 500</span>
            <span class="vp-error" id="errMotivo"></span>
          </div>

        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-vp">
            <i class="bi bi-check2-circle me-1"></i>Agendar cita
          </button>
          <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
        </div>
      </form>
    </section>

    <!-- listado -->
    <section class="vp-caja">

      <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
        <h5 class="mb-0"><i class="bi bi-list-check me-2"></i>Citas agendadas</h5>

        <div class="d-flex align-items-center gap-2">
          <label for="filtroEstado" class="vp-ayuda mb-0">Filtrar:</label>
          <select id="filtroEstado" class="form-select form-select-sm">
            <option value="Todas">Todas</option>
            <option value="Pendiente">Pendientes</option>
            <option value="Confirmada">Confirmadas</option>
            <option value="Atendida">Atendidas</option>
            <option value="Cancelada">Canceladas</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table vp-tabla align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Mascota</th>
              <th>Dueno</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Motivo</th>
              <th>Veterinario</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCitas"></tbody>
        </table>
      </div>

      <p class="vp-ayuda mb-0">
        Mostrando <strong id="contadorCitas">0</strong> cita(s).
      </p>
    </section>

  </main>

  <script src="../js/mock-data.js"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
